#!name=Ads-Meituan,JD,Taobao
#!desc=Ads-Meituan,JD,Taobao

[Rule]

# ==================== 拼多多（已移除核心域名拦截） ====================
DOMAIN,titan.pinduoduo.com,REJECT
DOMAIN,xg.pinduoduo.com,REJECT
DOMAIN,apm.pinduoduo.com,REJECT
DOMAIN,apm-a.pinduoduo.com,REJECT
DOMAIN,meta.pinduoduo.com,REJECT
DOMAIN,ta.pinduoduo.com,REJECT
DOMAIN,ta-a.pinduoduo.com,REJECT
DOMAIN,th.pinduoduo.com,REJECT
DOMAIN,th-a.pinduoduo.com,REJECT
DOMAIN,th-b.pinduoduo.com,REJECT
DOMAIN,cdl-1.pddpic.com,REJECT
DOMAIN,cd-1.pddpic.com,REJECT
DOMAIN,cdl-p2.pddpic.com,REJECT

# ==================== 京东 ====================
URL-REGEX,^http://\w{32}\.jddebug\.com/diagnose\?,REJECT
DOMAIN,ad.3.cn,REJECT
DOMAIN,ad.jd.com,REJECT
DOMAIN,static.360buyimg.com,REJECT

# ==================== 淘宝 & 闲鱼 & 飞猪 ====================
DOMAIN,adashx.m.taobao.com,REJECT
DOMAIN,ossgw.alicdn.com,REJECT
DOMAIN,ems.youku.com,REJECT
DOMAIN,hudong.alicdn.com,REJECT
DOMAIN,h-adashx.ut.taobao.com,REJECT
DOMAIN,ut.taobao.com,REJECT
DOMAIN,acs.m.taobao.com,REJECT
DOMAIN,acs.m.tmall.com,REJECT
URL-REGEX,^https://acs\.m\.tmall\.com/gw/mtop\.(alibaba\.advertisementservice|alimama\.etao|film\.mtopadvertise|o2o\.ad),REJECT

# ==================== 美团 & 大众点评 ====================
DOMAIN,portal-portm.meituan.com,REJECT
DOMAIN,metrics-picture.d.meituan.net,REJECT
DOMAIN,maplocatesdksnapshot.d.meituan.net,REJECT
DOMAIN,catdot.dianping.com,REJECT
DOMAIN,catfront.dianping.com,REJECT
DOMAIN,www.dpfile.com,REJECT

# ==================== 其他电商 ====================
DOMAIN,b.appsimg.com,REJECT                     # 唯品会
DOMAIN-SUFFIX,poizon.com,REJECT                 # 得物
DOMAIN,ad.suning.com,REJECT                     # 苏宁
DOMAIN,app.dewu.com,REJECT                      # 得物备用

# ==================== 全局兜底 ====================
IP-CIDR,103.37.155.60/32,REJECT

[Rewrite]
# ================= JQ 数据处理 =================

# 拼多多
http-response-jq ^https:\/\/api\.pinduoduo\.com\/api\/alexa\/homepage\/hub\? 'delpaths([["result","dy_module","irregular_banner_dy"],["result","icon_set"],["result","search_bar_hot_query"]]) | .result.bottom_tabs? |= map(select(.link | IN("index.html", "chat_list.html", "personal.html")))'
http-response-jq ^https:\/\/api\.pinduoduo\.com\/api\/philo\/personal\/hub\? 'delpaths([["monthly_card_entrance"],["personal_center_style_v2_vo"],["icon_set","icons"],["icon_set","top_personal_icons"]])'

# 闲鱼
http-response-jq ^https:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idlehome\.home\.nextfresh\/ '.data.homeTopList |= map(select(.sectionType == "kingkongDo")) | .data.sections |= map(select((.data.clickParam.args.cardType as $ct | $ct != "homeMultiBanner" and $ct != "mamaAD")))'

# 美团
http-response-jq ^https:\/\/rms\.meituan\.com\/api\/v\d\/rmsmina\/c\/queryShopPortalInfo\? 'delpaths([["data","popUpWindows"]])'

[Script]
# JD 去广告脚本
JD_Script = type=http-response, pattern=^https:\/\/(api|jxapi)\.m\.jd\.com\/client\.action\?functionId=(deliverLayer|getTabHomeInfo|myOrderInfo|orderTrackBusiness|personinfoBusiness|start|welcomeHome), script-path=https://kelee.one/Resource/JavaScript/JD/JD_remove_ads.js, requires-body=true

# 淘宝/闲鱼 去广告脚本
Taobao_Script_1 = type=http-response, pattern=^https:\/\/guide-acs\.m\.taobao\.com\/gw\/mtop\.taobao\.(cloudvideo\.video\.query|wireless\.home\.splash\.awesome\.get), script-path=https://kelee.one/Resource/JavaScript/Taobao/Taobao_remove_ads.js, requires-body=true
Taobao_Script_2 = type=http-response, pattern=^https:\/\/poplayer\.template\.alibaba\.com\/\w+\.json, script-path=https://kelee.one/Resource/JavaScript/Taobao/Taobao_remove_ads.js, requires-body=true

[MITM]
hostname = *.pinduoduo.com, *.jd.com, *.taobao.com, *.tmall.com, *.alicdn.com, *.goofish.com, *.meituan.com, *.dianping.com, *.elemecdn.com, *.dewu.com, *.suning.com, *.gifshow.com, *.ksapisrv.com, acs.m.tmall.com, guide-acs.m.taobao.com, poplayer.template.alibaba.com
